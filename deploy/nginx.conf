# Serves the BUILT site (dist/) and nothing else. Used by the Dockerfile; also a reference for any nginx host.
#
# What this guarantees:
#   * only files that are in dist/ can be downloaded; /src, /node_modules, /server, config files, hidden files and source maps
#     answer 404 (they are not in dist/ anyway: this is a second lock on the same door)
#   * the Vite dev server is never involved: /@vite/*, /@react-refresh, /@fs/* and /@id/* answer 404
#   * unknown paths fall back to index.html so React Router routes (/student, /admin/...) work on reload
#   * the security headers come from security-headers.conf, generated from public/_headers by scripts/headers-to-nginx.mjs
#
# Note on nginx: `add_header` in a location REPLACES the headers inherited from the server block, so each location below
# re-includes the shared file.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  # Never serve these, whatever is on disk
  location ~ /\.                                    { return 404; }
  location ~* \.map$                                { return 404; }
  location ~ ^/(src|node_modules|server|scripts|deploy|docs|public)(/|$) { return 404; }
  location ~ ^/(@vite|@react-refresh|@fs|@id)(/|$)  { return 404; }
  location ~* ^/(package(-lock)?\.json|vite\.config\.[a-z]+|tsconfig[^/]*\.json|Dockerfile|README\.md)$ { return 404; }

  # Hashed build output never changes: cache for a year
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The app shell must always be fresh so a new deploy is picked up
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Real files are served as they are, everything else is the single-page app
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
