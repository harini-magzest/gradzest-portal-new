# Runs on every pull request into main and on every push to main. Independent jobs so a failure says what broke:
#   lint             — ESLint: any error or warning fails (see eslint.config.mjs)
#   typecheck-build  — `tsc` + the production Vite build (what actually gets deployed)
#   backend-tests    — the API suite, against an in-memory MongoDB (no secrets, no real database)
#   ui-tests         — React component tests (jsdom)
#   api-image        — the API's Docker image (server/Dockerfile) builds and contains what the app needs
#
# To make these block bad merges, a repository admin turns on branch protection for `main`
# (Settings → Branches → Add rule → "Require status checks to pass before merging" → select the jobs, and
# "Require a pull request before merging"). See the README, "Checks and merging", and docs/BRANCH_PROTECTION.md.

name: CI

on:
  # Every pull request, whatever branch it targets: PRs merged into dev or into another feature branch used to skip
  # these checks entirely and reached main unchecked.
  pull_request:
  push:
    branches: [main, dev]

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Node comes from .nvmrc, the same major the production Docker build uses (Dockerfile: node:24-alpine).
env:
  CI: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Errors and warnings both fail: the "lint" script in package.json allows no warnings at all.
      - run: npm run lint

  typecheck-build:
    name: typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # `npm run build` is `tsc && vite build`: a type error fails here before the bundler runs.
      - run: npm run build

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      # The tests start an in-memory MongoDB, which downloads a mongod binary on first use; keep it between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongod-${{ runner.os }}-
      - run: npm ci
      - run: npm ci
        working-directory: server
      # No server/.env exists on a CI runner: the suite is self-contained (see server/test/setup.ts).
      - run: npm test

  ui-tests:
    name: ui-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:ui

  api-image:
    name: api-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t gradzest-api server
      # Checks that need no database: the things that would make a deployed image quietly unusable.
      # scanUpload.js shells out to /usr/bin/clamdscan and refuses every upload (503) when it is missing.
      - name: Image has the ClamAV client the upload scanner calls
        run: docker run --rm --entrypoint sh gradzest-api -c 'test -x /usr/bin/clamdscan'
      - name: Image does not run as root
        run: test "$(docker run --rm --entrypoint id gradzest-api -u)" != "0"
      - name: Entrypoint points clamdscan at CLAMD_HOST
        run: >
          docker run --rm -e CLAMD_HOST=clamav -e CLAMD_PORT=3311 gradzest-api
          sh -c 'grep -qx "TCPAddr clamav" "$CLAMD_CONFIG" && grep -qx "TCPSocket 3311" "$CLAMD_CONFIG"'
